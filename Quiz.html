<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Quiz App</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial;

/* Professional Quiz Background */

background-image: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("https://images.unsplash.com/photo-1587614382346-4ec70e388b28");

background-size: cover;
background-position: center;
background-repeat: no-repeat;

display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

/* Glass Effect Container */

.container{
background:rgba(255,255,255,0.9);
backdrop-filter: blur(10px);
width:500px;
padding:25px;
border-radius:12px;
box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h2{
text-align:center;
}

button{
padding:10px 20px;
margin:10px;
border:none;
border-radius:6px;
cursor:pointer;
background:#4facfe;
color:black;
font-weight:bold;
transition:0.3s;
}

button:hover{
background:#00c6ff;
transform:scale(1.05);
}

.option{
display:block;
background:#f1f1f1;
padding:10px;
margin:8px 0;
border-radius:5px;
cursor:pointer;
transition:0.3s;
}

.option:hover{
background:#ddd;
}

.correct{
background:#4CAF50 !important;
color:white;
}

.wrong{
background:#ff4d4d !important;
color:white;
}

.timer{
font-weight:bold;
color:red;
text-align:right;
}

.hidden{
display:none;
}

input{
padding:8px;
width:100%;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

/* RESULT POPUP */

#resultPopup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.resultBox{
background:white;
padding:30px;
border-radius:10px;
text-align:center;
width:400px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

</style>
</head>

<body>

<div class="container">

<div id="startScreen">
<h2>Quiz App</h2>
<input type="text" id="username" placeholder="Enter your name">
<button onclick="startQuiz()">Start Quiz</button>
<button onclick="showCreateQuiz()">Create Your Quiz</button>
</div>

<div id="quizScreen" class="hidden">

<div class="timer">Time: <span id="time">30</span>s</div>

<h3 id="question"></h3>

<div id="options"></div>

<button onclick="prevQuestion()">Previous</button>
<button onclick="nextQuestion()">Next</button>

</div>

<div id="createQuiz" class="hidden">

<h3>Create Your Quiz</h3>

<input id="newQ" placeholder="Enter question">
<input id="opt1" placeholder="Option 1">
<input id="opt2" placeholder="Option 2">
<input id="opt3" placeholder="Option 3">
<input id="opt4" placeholder="Option 4">
<input id="correct" placeholder="Correct option number (1-4)">

<button onclick="addQuestion()">Add Question</button>
<button onclick="goBack()">Back</button>

</div>

</div>

<!-- RESULT POPUP -->

<div id="resultPopup">

<div class="resultBox">

<h2>Your Quiz Result</h2>

<canvas id="resultChart"></canvas>

<br>

<button onclick="location.reload()">Close</button>

</div>

</div>

<script>

let questions = [

{
q:"What does HTML stand for?",
options:["Hyper Text Markup Language","High Tech Modern Language","Home Tool Markup Language","Hyperlinks Text Mark"],
answer:0
},

{
q:"Which language is used for styling?",
options:["HTML","CSS","Python","Java"],
answer:1
},

{
q:"Which language is used for web logic?",
options:["Python","C++","JavaScript","PHP"],
answer:2
},

{
q:"Which tag creates a link?",
options:["div","a","p","link"],
answer:1
},

{
q:"Which tag creates a paragraph?",
options:["p","h1","span","br"],
answer:0
},

{
q:"Which CSS property changes color?",
options:["font-color","text-style","color","background-style"],
answer:2
},

{
q:"Which company created JavaScript?",
options:["Microsoft","Netscape","Google","IBM"],
answer:1
},

{
q:"Which HTML tag shows image?",
options:["img","image","pic","photo"],
answer:0
},

{
q:"Which symbol used for id in CSS?",
options:[".","#","*","@"],
answer:1
},

{
q:"Which tag used for largest heading?",
options:["h6","h4","h1","h2"],
answer:2
}

]

let current = 0
let score = 0
let timer
let timeLeft = 30

function startQuiz(){

let name=document.getElementById("username").value

if(name==""){
alert("Please enter your name")
return
}

document.getElementById("startScreen").classList.add("hidden")
document.getElementById("quizScreen").classList.remove("hidden")

loadQuestion()

}

function loadQuestion(){

clearInterval(timer)

timeLeft=30
document.getElementById("time").innerText=timeLeft

timer=setInterval(()=>{

timeLeft--
document.getElementById("time").innerText=timeLeft

if(timeLeft==0){

clearInterval(timer)

alert("⏰ Time Out! Moving to next question")

let options=document.querySelectorAll(".option")

options[questions[current].answer].classList.add("correct")

setTimeout(()=>{
nextQuestion()
},1500)

}

},1000)

let q=questions[current]

document.getElementById("question").innerText=(current+1)+". "+q.q

let optionsHTML=""

q.options.forEach((opt,i)=>{

optionsHTML+=`<div class="option" onclick="selectOption(${i})">${opt}</div>`

})

document.getElementById("options").innerHTML=optionsHTML

}

function selectOption(i){

let options=document.querySelectorAll(".option")

if(i==questions[current].answer){

options[i].classList.add("correct")
score++

}else{

options[i].classList.add("wrong")
options[questions[current].answer].classList.add("correct")

}

}

function nextQuestion(){

if(current<questions.length-1){

current++
loadQuestion()

}else{

finishQuiz()

}

}

function prevQuestion(){

if(current>0){

current--
loadQuestion()

}

}

function finishQuiz(){

clearInterval(timer)

let correct = score
let wrong = questions.length - score

document.getElementById("resultPopup").style.display="flex"

let ctx=document.getElementById("resultChart")

new Chart(ctx,{

type:'pie',

data:{
labels:['Correct','Wrong'],
datasets:[{
data:[correct,wrong],
backgroundColor:['#4CAF50','#ff4d4d']
}]
}

})

}

function showCreateQuiz(){

document.getElementById("startScreen").classList.add("hidden")
document.getElementById("createQuiz").classList.remove("hidden")

}

function goBack(){
location.reload()
}

function addQuestion(){

let q=document.getElementById("newQ").value
let o1=document.getElementById("opt1").value
let o2=document.getElementById("opt2").value
let o3=document.getElementById("opt3").value
let o4=document.getElementById("opt4").value
let ans=parseInt(document.getElementById("correct").value)-1

if(q=="" || o1=="" || o2=="" || o3=="" || o4=="" || ans<0 || ans>3){
alert("Please fill all fields correctly")
return
}

/* Question add after existing 10 questions */

questions.push({
q:q,
options:[o1,o2,o3,o4],
answer:ans
})

alert("Question Added Successfully! Now total questions = " + questions.length)

/* Clear input fields */

document.getElementById("newQ").value=""
document.getElementById("opt1").value=""
document.getElementById("opt2").value=""
document.getElementById("opt3").value=""
document.getElementById("opt4").value=""
document.getElementById("correct").value=""

}

</script>

</body>
</html>
